{% extends "base.html" %}

{% block title %}Dashboard — Spendly{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="auth-container">
        <div class="auth-header">
            <p class="auth-subtitle">Welcome back,</p>
            <h1 class="auth-title">{{ session.get("user_name") }}</h1>
        </div>
        <div class="auth-card" style="text-align: center;">
            <p style="color: var(--ink-muted); font-size: 0.95rem; margin-bottom: 1.5rem;">
                Your expense dashboard is coming in the next step. Stay tuned!
            </p>
            <a href="{{ url_for('logout') }}" class="btn-ghost">Sign out</a>
        </div>
    </div>
</section>
{% endblock %}
